name: Public Release Validation

on:
  push:
    branches:
      - master
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate. Defaults to latest release.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-and-compose:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify public release files exist
        run: |
          test -f README.md
          test -f docs/ops/publishing.md
          test -f scripts/export-runtime-assets.ps1
          test -f container/docker-compose.release.yml

      - name: Verify README references public workflow
        run: |
          grep -q 'runtime-assets.zip' README.md
          grep -q 'docker-compose.release.yml' README.md
          grep -q 'docs/ops/publishing.md' README.md

      - name: Parse release compose YAML
        run: |
          python -m pip install --disable-pip-version-check --quiet pyyaml
          python - <<'PY'
          import pathlib
          import yaml

          path = pathlib.Path("container/docker-compose.release.yml")
          data = yaml.safe_load(path.read_text(encoding="utf-8"))
          assert "services" in data, "missing services section"
          for service in ("validator", "smoke", "openplc"):
              assert service in data["services"], f"missing service: {service}"
          assert "build" in data["services"]["validator"], "validator must build locally"
          assert "build" in data["services"]["openplc"], "openplc must build from runtime assets"
          print("release compose YAML parsed successfully")
          PY

      - name: Parse runtime asset exporter
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw 'scripts/export-runtime-assets.ps1'), [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }

  validate-release-assets:
    timeout-minutes: 30
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            tag="$EVENT_TAG"
          elif [ -n "$REQUESTED_TAG" ]; then
            tag="$REQUESTED_TAG"
          else
            tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          git check-ref-format "refs/tags/$tag"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'runtime-assets.zip' \
            --pattern 'runtime-assets.manifest.json' \
            --pattern 'runtime-assets.sha256' \
            --dir release-assets

      - name: Verify checksum
        working-directory: release-assets
        run: sha256sum -c runtime-assets.sha256

      - name: Validate asset structure
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          import zipfile

          base = pathlib.Path("release-assets")
          manifest = json.loads((base / "runtime-assets.manifest.json").read_text(encoding="utf-8"))
          zip_path = base / "runtime-assets.zip"

          required_roots = [
              "docs/harness",
              "PLC素材库",
              "validation/tools/plcverif",
              "validation/tools/OpenPLC_v3",
              "validation/config",
              "validation/templates",
              "validation/docker",
              "projects/FB_MainSequence",
          ]

          forbidden_patterns = [
              r"04_reports",
              r"PLCreX_outputs",
              r"\.git/",
              r"toolchain\.local\.json$",
              r"plcverif/output/",
              r"plcverif/workspace/",
              r"\.venv39/",
          ]

          included_roots = set(manifest.get("included_roots", []))
          missing_roots = [root for root in required_roots if root not in included_roots]
          if missing_roots:
              raise SystemExit(f"manifest missing required roots: {missing_roots}")

          with zipfile.ZipFile(zip_path) as zf:
              names = [info.filename for info in zf.infolist()]

          for root in required_roots:
              if not any(name.startswith(root.rstrip("/") + "/") or name == root for name in names):
                  raise SystemExit(f"zip missing required root payload: {root}")

          unexpected = []
          for pattern in forbidden_patterns:
              regex = re.compile(pattern)
              unexpected.extend(name for name in names if regex.search(name))

          if unexpected:
              sample = unexpected[:20]
              raise SystemExit(f"zip contains forbidden paths: {sample}")

          print("release asset structure validated")
          PY
